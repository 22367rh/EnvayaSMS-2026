# Gradle JVM + behaviour settings for the EnvayaSMS build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Stage 4 (concurrency migration) introduces androidx.core:core for JobIntentService,
# which is an AndroidX artifact. The app's own code still targets only the Android
# framework; enabling AndroidX here is required so the androidx.core dependency resolves.
android.useAndroidX=true

# This 2012-era code switches on R.id.* values in switch statements. AGP 8.x defaults to
# non-transitive R classes, which makes those IDs non-constant and breaks `case R.id.X:`.
# Disable it so R fields are generated as static final constants (as in the old build).
# Note: AGP 8.x generates non-final R id fields by default; this flag direction is tested.
android.nonTransitiveRClass=true
